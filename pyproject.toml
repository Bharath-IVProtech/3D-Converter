[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bimforge"
version = "0.1.0"
description = "AI-assisted 2D-to-3D BIM authoring for architecture, plumbing and electrical services"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "ezdxf>=1.3",
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8"]
ui = ["PySide6>=6.6", "vtk>=9.3"]
coordination = ["python-fcl>=0.7", "openpyxl>=3.1"]  # clash detection, XLSX quantities
pdf = ["pdfplumber>=0.11", "pypdfium2>=4"]
dev = ["pytest>=8", "hypothesis>=6"]
all = ["bimforge[ifc,ui,coordination,pdf,dev]"]

[project.scripts]
bimforge = "bimforge.__main__:main"

# Built-in adapters are registered through the same entry points third-party plugins use.
[project.entry-points."bimforge.importers"]
dxf = "bimforge.adapters.dxf_importer:DxfImporter"
dwg = "bimforge.adapters.dwg_importer:DwgImporter"
pdf = "bimforge.adapters.pdf_importer:PdfImporter"
ifc = "bimforge.adapters.ifc_importer:IfcImporter"

[project.entry-points."bimforge.exporters"]
ifc = "bimforge.adapters.ifc_exporter:IfcExporter"

[project.entry-points."bimforge.kernels"]
numpy = "bimforge.geometry.kernel:NumpyKernel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
